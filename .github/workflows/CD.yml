name:  Telani.SourceGenerator Continuous Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  test:
    name: Build and test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # avoid shallow clone so nbgv can do its work.

      - name: Setup .NET Core
        # With no version input the action falls back to the global.json in the repository
        # root, so the SDK version has exactly one home and Dependabot keeps it current.
        uses: actions/setup-dotnet@v6

      - name: Display dotnet version
        run: dotnet --version

      - name: Build
        run: dotnet build

      # --report-gh turns on Microsoft.Testing.Extensions.GitHubActionsReport, which the test
      # project references: collapsible per-assembly log groups, an ::error annotation per
      # failing test and a job summary on the run page. It only does anything inside Actions.
      - name: Run tests
        run: dotnet test --report-gh

  publish:
    name: Pack and publish
    # Only a push to main publishes: a pull request builds and tests but never touches the
    # feed, and needs: test means a red test suite stops the package from going out.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # avoid shallow clone so nbgv can do its work.

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6

      - name: Build Release
        run: dotnet build -c Release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Nuget-Package
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/src/bin/Release/*.nupkg

      - name: Prep packages
        run: dotnet nuget add source --username marv51 --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/telani-app/index.json"

      - name: Push package to GitHub packages
        run: dotnet nuget push src/bin/Release/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }}  --source "github"
